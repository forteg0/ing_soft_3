trigger:
- main

pool:
  name: Default

variables:
  buildConfiguration: 'Release'

stages:
# =========================
#   BACKEND (.NET 8)
# =========================
  - stage: Backend
    displayName: "Backend Build & Tests"
    jobs:
      - job: BuildAndTestBackend
        displayName: "Build & Test .NET Backend"
        steps:

          - checkout: self

          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.x'
            displayName: "Install .NET SDK 8"

          - script: |
              dotnet restore "$(System.DefaultWorkingDirectory)/EmployeeCrudApi/EmployeeCrudApi.sln"
            displayName: "Restore backend"

          - script: |
              dotnet build "$(System.DefaultWorkingDirectory)/EmployeeCrudApi/EmployeeCrudApi.sln" --configuration $(buildConfiguration)
            displayName: "Build backend"

          - script: |
              dotnet test "$(System.DefaultWorkingDirectory)/EmployeeCrudApi/EmployeeCrudApi.sln" \
                --configuration $(buildConfiguration) \
                --logger "trx"
            displayName: "Run backend tests"

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
            displayName: "Publish backend test results"

          - publish: "$(System.DefaultWorkingDirectory)/EmployeeCrudApi/EmployeeCrudApi/bin/Release"
            artifact: backend
            displayName: "Publish backend artifacts"


# =========================
#   FRONTEND (Angular)
# =========================
  - stage: Frontend
    displayName: "Frontend Build (Angular)"
    dependsOn: Backend
    jobs:
      - job: BuildFrontend
        displayName: "Build Angular App"
        steps:

          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: "Install Node.js 18"

          - script: |
              cd "$(System.DefaultWorkingDirectory)/EmployeeCrudAngular"
              npm install --legacy-peer-deps
            displayName: "Install dependencies"

          - script: |
              cd "$(System.DefaultWorkingDirectory)/EmployeeCrudAngular"
              npm run build
            displayName: "Build Angular frontend"

          - publish: "$(System.DefaultWorkingDirectory)/EmployeeCrudAngular/dist"
            artifact: frontend
            displayName: "Publish frontend artifacts"
