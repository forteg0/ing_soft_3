trigger:
  - main

# ========================
#  AGENTE LOCAL (SELF-HOSTED)
# ========================
pool:
  name: Default   # Tu agente local registrado en Azure DevOps
variables:
  buildConfiguration: 'Release'

stages:

  # ========================
  # BACKEND (.NET 8)
  # ========================
  - stage: Backend
    displayName: "Backend Build & Tests"
    jobs:
      - job: BuildAndTestBackend
        displayName: "Build & Test .NET Backend"
        steps:

          - task: UseDotNet@2
            displayName: "Install .NET SDK 8"
            inputs:
              packageType: 'sdk'
              version: '8.x'

          # Restore (usamos la solución!)
          - script: |
              dotnet restore EmployeeCrudApi.sln
            displayName: "Restore .NET solution"

          # Build
          - script: |
              dotnet build EmployeeCrudApi.sln --configuration $(buildConfiguration)
            displayName: "Build .NET solution"

          # Run tests (unit + integration si tenés)
          - script: |
              dotnet test EmployeeCrudApi.sln --configuration $(buildConfiguration) --logger "trx"
            displayName: "Run backend tests"

          - task: PublishTestResults@2
            displayName: "Publish .NET test results"
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              failTaskOnFailedTests: true


  # ========================
  # FRONTEND (ANGULAR)
  # ========================
  - stage: Frontend
    displayName: "Frontend Build & Tests"
    dependsOn: Backend
    jobs:

      - job: BuildAndTestFrontend
        displayName: "Build & Test Angular Frontend"
        steps:

          # Cache para node_modules
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: 'frontend/node_modules'
            displayName: "Cache node_modules"

          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: "Install Node.js"

          - script: |
              cd frontend
              npm install
            displayName: "Install Angular dependencies"

          # Ejecutar tests con Karma + Jasmine + ChromeHeadless
          - script: |
              cd frontend
              npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage --progress=false --no-sandbox
            displayName: "Run Angular tests"

          # Publicar resultados si usás junit reporter
          - task: PublishTestResults@2
            displayName: "Publish Angular test results"
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'frontend/test-results/junit/*.xml'
              failTaskOnFailedTests: true

          - script: |
              cd frontend
              npm run build
            displayName: "Build Angular project"
